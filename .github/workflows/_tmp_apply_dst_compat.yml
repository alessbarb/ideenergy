name: Temporary apply DST compatibility fixes

on:
  push:
    branches:
      - fix/dst-historical-periods

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dst-historical-periods
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Normalize historical filter bounds and test expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path("ideenergy/client.py")
          text = client.read_text()
          old = '''        ret = parsers.parse_historical_consumption(data)\n        ret.periods = [x for x in ret.periods if x.start >= start and x.end <= end]\n'''
          new = '''        ret = parsers.parse_historical_consumption(data)\n        filter_start = parsers.as_local_datetime(start)\n        filter_end = parsers.as_local_datetime(end)\n        ret.periods = [\n            x\n            for x in ret.periods\n            if x.start >= filter_start and x.end <= filter_end\n        ]\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected historical-consumption filter")
          client.write_text(text.replace(old, new))

          parsers = Path("ideenergy/parsers.py")
          text = parsers.read_text()
          old = '''LOCAL_TZ = ZoneInfo("Europe/Madrid")\n\n\ndef _elapsed_hour_period(base_dt: datetime, idx: int) -> tuple[datetime, datetime]:\n'''
          new = '''LOCAL_TZ = ZoneInfo("Europe/Madrid")\n\n\ndef as_local_datetime(dt: datetime) -> datetime:\n    """Interpret legacy naive values locally while preserving aware values."""\n    if dt.tzinfo is None:\n        return dt.replace(tzinfo=LOCAL_TZ)\n    return dt.astimezone(LOCAL_TZ)\n\n\ndef _elapsed_hour_period(base_dt: datetime, idx: int) -> tuple[datetime, datetime]:\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected parser timezone anchor")
          text = text.replace(old, new)
          text = text.replace(
              '''    if base_dt.tzinfo is None:\n        base_local = base_dt.replace(tzinfo=LOCAL_TZ)\n    else:\n        base_local = base_dt.astimezone(LOCAL_TZ)\n\n    base_utc = base_local.astimezone(UTC)\n''',
              '''    base_utc = as_local_datetime(base_dt).astimezone(UTC)\n''',
          )
          parsers.write_text(text)

          tests = Path("tests/test_client.py")
          text = tests.read_text()
          old_import = 'from datetime import datetime, timedelta\n'
          new_import = 'from datetime import datetime, timedelta\nfrom zoneinfo import ZoneInfo\n'
          if text.count(old_import) != 1:
              raise SystemExit("unexpected test datetime import")
          text = text.replace(old_import, new_import)
          old_expectation = '            self.assertEqual(ret.periods[25].start, datetime(2022, 8, 20, 1, 0))\n'
          new_expectation = '''            self.assertEqual(\n                ret.periods[25].start,\n                datetime(2022, 8, 20, 1, 0, tzinfo=ZoneInfo("Europe/Madrid")),\n            )\n'''
          if text.count(old_expectation) != 1:
              raise SystemExit("unexpected generation timestamp expectation")
          tests.write_text(text.replace(old_expectation, new_expectation))
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files ideenergy/client.py ideenergy/parsers.py tests/test_client.py tests/test_dst_historical_periods.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideenergy/client.py ideenergy/parsers.py tests/test_client.py tests/test_dst_historical_periods.py
          git commit -m "fix: normalize DST-aware historical range filtering"
          git push origin HEAD:fix/dst-historical-periods
