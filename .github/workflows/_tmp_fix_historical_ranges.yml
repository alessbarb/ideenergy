name: Temporary historical range fix

on:
  push:
    branches:
      - fix/historical-range-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-range-normalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply atomic range normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ideenergy/client.py")
          text = path.read_text()
          old = '''        end = end or datetime.now()\n        start = start or end - timedelta(days=7)\n\n        start = min([start, end])\n        end = max([start, end])\n'''
          new = '''        end = end or datetime.now()\n        start = start or end - timedelta(days=7)\n        start, end = sorted((start, end))\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 historical range blocks, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files ideenergy/client.py tests/test_historical_ranges.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideenergy/client.py tests/test_historical_ranges.py
          git commit -m "fix: normalize historical date ranges atomically"
          git push origin HEAD:fix/historical-range-normalization
