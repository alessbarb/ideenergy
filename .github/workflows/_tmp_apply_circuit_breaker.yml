name: Temporary apply circuit breaker

on:
  push:
    branches:
      - fix/request-circuit-breaker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/request-circuit-breaker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply bounded authenticated-operation circuit breaker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ideenergy/client.py")
          text = path.read_text()

          old_constants = '''SESSION_TIMEOUT = 900\nSESSION_AUTO_REFRESH = True\nAUTHENTICATION_HTTP_STATUSES = frozenset({401, 403})\n'''
          new_constants = '''SESSION_TIMEOUT = 900\nSESSION_AUTO_REFRESH = True\nAUTHENTICATION_HTTP_STATUSES = frozenset({401, 403})\nCIRCUIT_BREAKER_HTTP_STATUSES = frozenset({401, 403, 429, 500, 502, 503, 504})\nCIRCUIT_BREAKER_FAILURE_THRESHOLD = 3\nCIRCUIT_BREAKER_TIMEOUT = timedelta(minutes=15)\n'''
          if text.count(old_constants) != 1:
              raise SystemExit("unexpected session constants block")
          text = text.replace(old_constants, new_constants)

          old_decorator = '''    @functools.wraps(fn)\n    async def _wrap(client: Client, *args, **kwargs):\n        await client._ensure_session()\n\n        try:\n            return await fn(client, *args, **kwargs)\n        except RequestFailedError as exc:\n            if (\n                client._session_auto_refresh is not True\n                or exc.status not in AUTHENTICATION_HTTP_STATUSES\n            ):\n                raise\n\n            client._invalidate_session()\n            await client._ensure_session()\n            return await fn(client, *args, **kwargs)\n\n    return _wrap\n'''
          new_decorator = '''    @functools.wraps(fn)\n    async def _wrap(client: Client, *args, **kwargs):\n        client._raise_if_circuit_open()\n\n        try:\n            await client._ensure_session()\n            try:\n                result = await fn(client, *args, **kwargs)\n            except RequestFailedError as exc:\n                if (\n                    client._session_auto_refresh is not True\n                    or exc.status not in AUTHENTICATION_HTTP_STATUSES\n                ):\n                    raise\n\n                client._invalidate_session()\n                await client._ensure_session()\n                result = await fn(client, *args, **kwargs)\n        except RequestFailedError as exc:\n            client._record_operation_failure(exc)\n            raise\n        else:\n            client._record_operation_success()\n            return result\n\n    return _wrap\n'''
          if text.count(old_decorator) != 1:
              raise SystemExit("unexpected auth_required block")
          text = text.replace(old_decorator, new_decorator)

          old_init = '''        self._login_ts: datetime | None = None\n        self._auth_lock = asyncio.Lock()\n'''
          new_init = '''        self._login_ts: datetime | None = None\n        self._auth_lock = asyncio.Lock()\n        self._circuit_failure_count = 0\n        self._circuit_open_until: datetime | None = None\n'''
          if text.count(old_init) != 1:
              raise SystemExit("unexpected client state block")
          text = text.replace(old_init, new_init)

          old_methods = '''    def _invalidate_session(self) -> None:\n        self._login_ts = None\n\n    async def _ensure_session(self) -> None:\n'''
          new_methods = '''    def _invalidate_session(self) -> None:\n        self._login_ts = None\n\n    def _raise_if_circuit_open(self) -> None:\n        if self._circuit_open_until is None:\n            return\n\n        now = datetime.now()\n        if now >= self._circuit_open_until:\n            self._record_operation_success()\n            return\n\n        raise CircuitOpenError(self._circuit_open_until - now)\n\n    def _record_operation_failure(self, exc: RequestFailedError) -> None:\n        if exc.status not in CIRCUIT_BREAKER_HTTP_STATUSES:\n            return\n\n        self._circuit_failure_count += 1\n        if self._circuit_failure_count >= CIRCUIT_BREAKER_FAILURE_THRESHOLD:\n            self._circuit_open_until = datetime.now() + CIRCUIT_BREAKER_TIMEOUT\n\n    def _record_operation_success(self) -> None:\n        self._circuit_failure_count = 0\n        self._circuit_open_until = None\n\n    async def _ensure_session(self) -> None:\n'''
          if text.count(old_methods) != 1:
              raise SystemExit("unexpected session helper block")
          text = text.replace(old_methods, new_methods)

          old_errors = '''class ClientError(Exception):\n    pass\n\n\nclass RequestFailedError(ClientError):\n'''
          new_errors = '''class ClientError(Exception):\n    pass\n\n\nclass CircuitOpenError(ClientError):\n    def __init__(self, retry_after: timedelta):\n        self.retry_after = retry_after\n\n    def __str__(self):\n        seconds = max(0, int(self.retry_after.total_seconds()))\n        return f"i-DE request circuit is open for {seconds} seconds"\n\n\nclass RequestFailedError(ClientError):\n'''
          if text.count(old_errors) != 1:
              raise SystemExit("unexpected client error block")
          text = text.replace(old_errors, new_errors)
          path.write_text(text)

          init_path = Path("ideenergy/__init__.py")
          init = init_path.read_text()
          old_import = '''    AuthenticationError,\n    Client,\n    ClientError,\n    CommandError,\n'''
          new_import = '''    AuthenticationError,\n    CircuitOpenError,\n    Client,\n    ClientError,\n    CommandError,\n'''
          if init.count(old_import) != 1:
              raise SystemExit("unexpected ideenergy import block")
          init = init.replace(old_import, new_import)
          old_all = '''    "AuthenticationError",\n    "Client",\n    "ClientError",\n'''
          new_all = '''    "AuthenticationError",\n    "CircuitOpenError",\n    "Client",\n    "ClientError",\n'''
          if init.count(old_all) != 1:
              raise SystemExit("unexpected ideenergy __all__ block")
          init_path.write_text(init.replace(old_all, new_all))
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files ideenergy/client.py ideenergy/__init__.py tests/test_circuit_breaker.py || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideenergy/client.py ideenergy/__init__.py tests/test_circuit_breaker.py
          git commit -m "fix: add fail-fast request circuit breaker"
          git push origin HEAD:fix/request-circuit-breaker
