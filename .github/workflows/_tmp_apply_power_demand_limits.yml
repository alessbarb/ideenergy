name: Temporary fix power-demand regression imports

on:
  push:
    branches:
      - fix/power-demand-invalid-limits

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/power-demand-invalid-limits
          fetch-depth: 0
      - name: Add regression-test imports
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_client.py")
          text = tests.read_text()
          text = text.replace(
              "from ideenergy import Client, MockClient\n",
              "from ideenergy import Client, CommandError, MockClient\n",
          )
          text = text.replace(
              "from ideenergy.client import _LOGIN_ENDPOINT\n",
              "from ideenergy.client import _LOGIN_ENDPOINT, _POWER_DEMAND_LIMITS_ENDPOINT\n",
          )
          tests.write_text(text)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_client.py
          git commit -m "test: cover invalid power-demand limits"
          git push origin HEAD:fix/power-demand-invalid-limits
