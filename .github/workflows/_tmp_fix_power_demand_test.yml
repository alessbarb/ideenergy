name: Temporary fix power-demand limits regression

on:
  push:
    branches:
      - fix/power-demand-invalid-limits

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/power-demand-invalid-limits
          fetch-depth: 0
      - name: Make regression test self-contained
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_client.py")
          text = tests.read_text()
          old = '''    async def test_power_demand_invalid_limits_raise_command_error(self):\n        self.client._login_ts = datetime.now()\n        invalid_limits = {"resultado": "error"}\n        self.client.request_json = AsyncMock(return_value=invalid_limits)\n\n        with self.assertRaises(CommandError):\n            await self.client.get_historical_power_demand()\n\n        self.client.request_json.assert_awaited_once_with(\n            "GET", _POWER_DEMAND_LIMITS_ENDPOINT\n        )\n'''
          new = '''    async def test_power_demand_invalid_limits_raise_command_error(self):\n        client = Client(None, "x", "y")\n        client._login_ts = datetime.now()\n        invalid_limits = {"resultado": "error"}\n        client.request_json = AsyncMock(return_value=invalid_limits)\n\n        with self.assertRaises(CommandError):\n            await client.get_historical_power_demand()\n\n        client.request_json.assert_awaited_once_with(\n            "GET", _POWER_DEMAND_LIMITS_ENDPOINT\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected regression test body")
          tests.write_text(text.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_client.py
          git commit -m "test: isolate invalid power-demand limits regression"
          git push origin HEAD:fix/power-demand-invalid-limits
