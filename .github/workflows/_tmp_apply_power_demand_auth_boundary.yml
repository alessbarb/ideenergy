name: Temporary apply power-demand auth boundary fix

on:
  push:
    branches:
      - fix/power-demand-auth-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/power-demand-auth-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Keep one authentication boundary for power demand
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path("ideenergy/client.py")
          text = client.read_text()
          old = '''    @auth_required\n    async def get_historical_power_demand(self) -> HistoricalPowerDemand:\n        @auth_required\n        async def _get_available_interval(client):\n            url = _POWER_DEMAND_LIMITS_ENDPOINT\n\n            data = await client.request_json("GET", url)\n            assert data.get("resultado") == "correcto"\n\n            return data\n\n        limits = await _get_available_interval(self)\n'''
          new = '''    @auth_required\n    async def get_historical_power_demand(self) -> HistoricalPowerDemand:\n        async def _get_available_interval(client):\n            url = _POWER_DEMAND_LIMITS_ENDPOINT\n\n            data = await client.request_json("GET", url)\n            assert data.get("resultado") == "correcto"\n\n            return data\n\n        limits = await _get_available_interval(self)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected power-demand authentication boundary")
          client.write_text(text.replace(old, new))

          tests = Path("tests/test_circuit_breaker.py")
          text = tests.read_text()
          marker = "async def test_power_demand_failures_share_outer_circuit_boundary"
          if marker not in text:
              insert = '''\n    async def test_power_demand_failures_share_outer_circuit_boundary(self):\n        limits = {\n            "resultado": "correcto",\n            "fecMax": "07-09-202600:00:00",\n        }\n        error = RequestFailedError(failed_response(503))\n        self.client.request_json = AsyncMock(\n            side_effect=[limits, error, limits, error, limits, error]\n        )\n\n        for _ in range(3):\n            with self.assertRaises(RequestFailedError):\n                await self.client.get_historical_power_demand()\n\n        self.assertEqual(self.client._circuit_failure_count, 3)\n        self.assertEqual(self.client.request_json.await_count, 6)\n\n        with self.assertRaises(CircuitOpenError):\n            await self.client.get_historical_power_demand()\n\n        self.assertEqual(self.client.request_json.await_count, 6)\n'''
              anchor = '\n\nif __name__ == "__main__":\n'
              if anchor not in text:
                  raise SystemExit("test module footer not found")
              text = text.replace(anchor, insert + anchor)
          tests.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          bullet = "- Keep power-demand retrieval under one authentication/circuit-breaker boundary so intermediate requests cannot reset consecutive failure tracking.\n"
          anchor = "- Reset the circuit after a successful authenticated operation or after the cooldown expires.\n"
          if bullet not in text:
              if anchor not in text:
                  raise SystemExit("changelog reliability anchor not found")
              text = text.replace(anchor, anchor + bullet)
          changelog.write_text(text)
          PY
      - run: python -m pip install --upgrade pre-commit
      - name: Apply repository formatting
        run: pre-commit run --files ideenergy/client.py tests/test_circuit_breaker.py CHANGELOG.md || true
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideenergy/client.py tests/test_circuit_breaker.py CHANGELOG.md
          git commit -m "fix: keep power-demand auth recovery bounded"
          git push origin HEAD:fix/power-demand-auth-boundary
